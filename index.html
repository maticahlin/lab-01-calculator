<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-hidden="true"></canvas>
      <label for="expression" class="visually-hidden">Type a sum, for example 12 × 4</label>
      <input
        id="expression"
        class="visually-hidden"
        type="text"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />
      <output id="result" class="visually-hidden" aria-live="polite">---</output>
      <p id="error" class="visually-hidden" role="alert"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
