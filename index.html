<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="app">
      <label for="valueOne" class="desc">First number</label
      ><input type="number" id="valueOne" placeholder="Enter a number" />
      <label for="valueTwo" class="desc">Second number</label
      ><input type="number" id="valueTwo" placeholder="Enter a number" />
      <label for="operator" class="desc">Operator</label
      ><select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <output id="result" aria-live="polite">---</output>
      <p id="error"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
